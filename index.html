<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS • Personal Dashboard</title>
<style>
:root{--bg:#050814;--bg2:#0a1022;--panel:rgba(12,20,40,.68);--panel2:rgba(15,25,49,.78);--text:#f5f7ff;--muted:#8290ad;--line:rgba(112,135,190,.22);--cyan:#43e8ff;--violet:#8b5cf6;--pink:#ff4fd8;--danger:#ff6b8a;--shadow:0 20px 70px rgba(0,0,0,.42)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;background:radial-gradient(circle at 15% 10%,rgba(67,232,255,.11),transparent 28%),radial-gradient(circle at 90% 15%,rgba(139,92,246,.16),transparent 30%),linear-gradient(135deg,var(--bg),var(--bg2));min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(67,232,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(67,232,255,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 92%)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,rgba(67,232,255,.018) 50%);background-size:100% 4px;opacity:.35}
.app{max-width:1180px;margin:auto;padding:22px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px}.orb{width:45px;height:45px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 4%,var(--cyan) 15%,var(--violet) 48%,transparent 70%);box-shadow:0 0 24px rgba(67,232,255,.65),0 0 55px rgba(139,92,246,.28);animation:pulse 3s infinite}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--cyan);font-weight:800}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,40px);letter-spacing:-1.5px}.sub{color:var(--muted);font-size:13px}.theme{border:1px solid var(--line);background:rgba(15,25,49,.72);color:var(--text);border-radius:14px;padding:11px 15px;font-weight:800;backdrop-filter:blur(14px);box-shadow:0 0 25px rgba(67,232,255,.05)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 4;position:relative;background:linear-gradient(145deg,rgba(16,27,52,.82),rgba(7,13,29,.72));border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(18px);overflow:hidden}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);opacity:.65}.wide{grid-column:span 6}.card:hover{transform:translateY(-2px);border-color:rgba(67,232,255,.35);box-shadow:0 25px 80px rgba(0,0,0,.48),0 0 30px rgba(67,232,255,.06);transition:.25s}h2{font-size:15px;margin:0 0 16px;display:flex;align-items:center;gap:8px;letter-spacing:.5px}.tag{font-size:9px;color:var(--cyan);border:1px solid rgba(67,232,255,.28);padding:3px 6px;border-radius:999px;margin-left:auto;letter-spacing:1px}.clock{font-size:clamp(44px,7vw,70px);line-height:1;font-weight:900;letter-spacing:-2px;text-shadow:0 0 28px rgba(67,232,255,.18)}.date{margin-top:10px;color:var(--muted);font-size:14px}.weather{display:flex;align-items:center;gap:18px}.weatherIcon{font-size:56px;filter:drop-shadow(0 0 12px rgba(67,232,255,.25))}.temp{font-size:42px;font-weight:900}.muted{color:var(--muted)}
input,textarea{width:100%;background:rgba(3,8,19,.65);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:12px 13px;outline:none;transition:.2s}input:focus,textarea:focus{border-color:rgba(67,232,255,.7);box-shadow:0 0 0 3px rgba(67,232,255,.07),0 0 20px rgba(67,232,255,.07)}textarea{min-height:82px;resize:vertical}.row{display:flex;gap:8px;margin:9px 0}.btn{background:linear-gradient(135deg,var(--violet),#5967ff);color:white;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 15px;font-weight:900;box-shadow:0 8px 25px rgba(99,102,241,.22)}.btn:hover{filter:brightness(1.1)}.list{display:flex;flex-direction:column;gap:8px;max-height:270px;overflow:auto;margin-top:12px}.item{background:rgba(16,27,52,.65);border:1px solid var(--line);padding:10px;border-radius:12px;display:flex;gap:9px;align-items:flex-start}.item>span{flex:1;word-break:break-word}.del{background:transparent;color:#ff8ba4;border:1px solid rgba(255,107,138,.28);border-radius:9px;padding:4px 8px}.del:hover{background:rgba(255,107,138,.08)}a{color:#8eefff;text-decoration:none;font-weight:800;word-break:break-all}.done{text-decoration:line-through;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:14px;font-size:13px}.status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-top:14px}.dot{width:7px;height:7px;border-radius:50%;background:#46f3a4;box-shadow:0 0 10px #46f3a4}.footer{text-align:center;color:#5f6c88;font-size:11px;margin:18px 0 5px;letter-spacing:.5px}
.light{--bg:#eef7ff;--bg2:#e9e4ff;--panel:rgba(255,255,255,.78);--panel2:#fff;--text:#10182b;--muted:#60708e;--line:rgba(75,95,140,.18)}.light body{background:linear-gradient(135deg,#eef7ff,#eee9ff)}
@keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.18)}}
@media(max-width:850px){.card,.wide{grid-column:span 6}}@media(max-width:560px){.app{padding:13px}.card,.wide{grid-column:span 12}.topbar{align-items:flex-start}.theme{padding:9px 11px}.orb{width:39px;height:39px}.brand h1{font-size:28px}.sub{font-size:12px}.card{padding:16px;border-radius:19px}}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="orb"></div><div><div class="eyebrow">NEXUS / PERSONAL OS</div><h1>My Dashboard</h1><div class="sub">Your private command center</div></div></div><button class="theme" id="theme">◐ Theme</button></header>
<div class="grid">
<section class="card wide"><h2>◷ SYSTEM CLOCK <span class="tag">LIVE</span></h2><div id="clock" class="clock">--:--:--</div><div id="date" class="date"></div><div class="status"><span class="dot"></span>Local system time active</div></section>
<section class="card wide"><h2>◈ WEATHER <span class="tag">LIVE DATA</span></h2><div class="weather"><div id="wi" class="weatherIcon">🌤️</div><div><div id="temp" class="temp">--°C</div><div id="cond" class="muted">Connecting to weather...</div><div id="loc" class="muted"></div></div></div></section>
<section class="card"><h2>✎ NOTES <span class="tag">LOCAL</span></h2><textarea id="note" placeholder="Write a note..."></textarea><button class="btn" onclick="addNote()">+ Add Note</button><div id="notes" class="list"></div></section>
<section class="card"><h2>✓ TASKS <span class="tag">TODO</span></h2><div class="row"><input id="task" placeholder="Add a task" onkeydown="if(event.key==='Enter')addTask()"><button class="btn" onclick="addTask()">Add</button></div><div id="tasks" class="list"></div></section>
<section class="card"><h2>⌁ BOOKMARKS <span class="tag">LINKS</span></h2><input id="bn" placeholder="Website name"><div class="row"><input id="bu" placeholder="https://example.com" onkeydown="if(event.key==='Enter')addBookmark()"><button class="btn" onclick="addBookmark()">Add</button></div><div id="bookmarks" class="list"></div></section>
</div><div class="footer">NEXUS v2 • Notes, tasks & bookmarks stay in this browser</div></div>
<script>
const $=x=>document.getElementById(x),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let notes=JSON.parse(localStorage.notes||'[]'),tasks=JSON.parse(localStorage.tasks||'[]'),bookmarks=JSON.parse(localStorage.bookmarks||'[]');
const save=()=>{localStorage.notes=JSON.stringify(notes);localStorage.tasks=JSON.stringify(tasks);localStorage.bookmarks=JSON.stringify(bookmarks)};
function tick(){let d=new Date();$('clock').textContent=d.toLocaleTimeString();$('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}setInterval(tick,1000);tick();
function renderNotes(){$('notes').innerHTML=notes.length?notes.map((x,i)=>`<div class="item"><span>${esc(x)}</span><button class="del" onclick="notes.splice(${i},1);save();renderNotes()">Delete</button></div>`).join(''):'<div class="empty">No notes yet.</div>'}
function addNote(){let x=$('note').value.trim();if(!x)return;notes.unshift(x);$('note').value='';save();renderNotes()}
function renderTasks(){$('tasks').innerHTML=tasks.length?tasks.map((x,i)=>`<div class="item"><input type="checkbox" ${x.done?'checked':''} onchange="tasks[${i}].done=this.checked;save();renderTasks()"><span class="${x.done?'done':''}">${esc(x.text)}</span><button class="del" onclick="tasks.splice(${i},1);save();renderTasks()">×</button></div>`).join(''):'<div class="empty">No tasks yet.</div>'}
function addTask(){let x=$('task').value.trim();if(!x)return;tasks.unshift({text:x,done:false});$('task').value='';save();renderTasks()}
function renderBookmarks(){$('bookmarks').innerHTML=bookmarks.length?bookmarks.map((x,i)=>`<div class="item"><span><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a><br><small class="muted">${esc(x.url)}</small></span><button class="del" onclick="bookmarks.splice(${i},1);save();renderBookmarks()">×</button></div>`).join(''):'<div class="empty">No bookmarks yet.</div>'}
function addBookmark(){let n=$('bn').value.trim(),u=$('bu').value.trim();if(!n||!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;bookmarks.unshift({name:n,url:u});$('bn').value='';$('bu').value='';save();renderBookmarks()}
async function weather(){try{let p=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:7000})),{latitude:a,longitude:o}=p.coords;let d=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${a}&longitude=${o}&current=temperature_2m,weather_code&timezone=auto`).then(r=>r.json()),m={0:['☀️','Clear'],1:['🌤️','Mainly clear'],2:['⛅','Partly cloudy'],3:['☁️','Cloudy'],45:['🌫️','Fog'],51:['🌦️','Drizzle'],61:['🌧️','Rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],71:['🌨️','Snow'],80:['🌦️','Showers'],95:['⛈️','Thunderstorm']},z=m[d.current.weather_code]||['🌤️','Weather'];$('wi').textContent=z[0];$('temp').textContent=Math.round(d.current.temperature_2m)+'°C';$('cond').textContent=z[1];$('loc').textContent='Your current location'}catch(e){$('cond').textContent='Allow location access for live weather';$('loc').textContent='Weather unavailable'}}
$('theme').onclick=()=>{document.documentElement.classList.toggle('light');localStorage.theme=document.documentElement.classList.contains('light')?'light':'dark'};if(localStorage.theme==='light')document.documentElement.classList.add('light');renderNotes();renderTasks();renderBookmarks();weather();
</script></body></html>
